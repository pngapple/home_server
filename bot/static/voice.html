<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice status</title>
<style>
  :root {
    color-scheme: dark;
    --page:           #0a0c10;
    --surface-1:      #14171d;
    --surface-2:      #191d24;
    --text-primary:   #eef0f3;
    --text-secondary: #9aa1ac;
    --text-muted:     #5d636e;
    --border:         rgba(255,255,255,0.08);
    --series-1:       #5b9df9;
    --series-2:       #f5a35b;
    --good:           #35c987;
    --warn:           #e0b23c;
    --danger:         #e5586a;
    --shadow:         0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --page:           #f7f7f5;
      --surface-1:      #ffffff;
      --surface-2:      #f0f0ee;
      --text-primary:   #14161a;
      --text-secondary: #55595f;
      --text-muted:     #8b8f95;
      --border:         rgba(11,11,11,0.08);
      --series-1:       #2a6fd6;
      --series-2:       #d9702a;
      --good:           #1f9e5e;
      --warn:           #a87a12;
      --danger:         #c93a4e;
      --shadow:         0 1px 2px rgba(20,20,20,0.05), 0 8px 24px -14px rgba(20,20,20,0.15);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 34em; margin: 0 auto; padding: 3em 1.5em 4em; }
  .header { display: flex; align-items: baseline; gap: 0.7em; margin-bottom: 0.2em; }
  h1 { font-size: 1.5em; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .live { display: inline-flex; align-items: center; gap: 0.45em; font-size: 0.76em; color: var(--text-muted); }
  .live .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 0 rgba(53,201,135,0.5);
    animation: livepulse 2s infinite;
  }
  .live.offline .pulse { background: var(--danger); animation: none; box-shadow: none; }
  @keyframes livepulse {
    0%   { box-shadow: 0 0 0 0 rgba(53,201,135,0.45); }
    70%  { box-shadow: 0 0 0 6px rgba(53,201,135,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,201,135,0); }
  }
  .subtitle { color: var(--text-secondary); font-size: 0.92em; margin: 0 0 1.5em; }

  #audio-enable {
    display: block; margin: 0 0 1.5em; padding: 0.6em 1em;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary);
    font-size: 0.85em; cursor: pointer;
  }
  #audio-enable:hover { background: var(--surface-2); }

  .ptt-row { display: flex; align-items: center; gap: 0.9em; margin: 0 0 0.5em; }
  #ptt-button {
    display: flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; flex: none; border-radius: 50%;
    background: var(--surface-1); border: 1px solid var(--border);
    color: var(--text-primary); font-size: 1.3em; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: none;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  #ptt-button:active,
  #ptt-button.held {
    background: var(--danger); color: #fff; transform: scale(1.08);
    box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 20%, transparent);
  }
  #ptt-button:disabled { opacity: 0.4; cursor: not-allowed; }
  #ptt-label { font-size: 0.85em; color: var(--text-secondary); }
  .mic-note { font-size: 0.78em; color: var(--text-muted); margin: 0 0 1.5em; max-width: 30em; }
  .mic-note.error { color: var(--danger); }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.4em 1.5em 2em;
    box-shadow: var(--shadow);
  }

  .orb-wrap { display: flex; flex-direction: column; align-items: center; }
  .orb-stage {
    --phase-color: var(--text-muted);
    position: relative;
    width: 200px; height: 200px;
    display: flex; align-items: center; justify-content: center;
  }
  .orb-ring, .orb-ring-2 {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--phase-color);
    opacity: 0;
  }
  .orb-core {
    position: relative; z-index: 1;
    width: 108px; height: 108px; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%,
      color-mix(in srgb, var(--phase-color) 70%, white 30%),
      var(--phase-color));
    box-shadow: 0 0 46px 4px color-mix(in srgb, var(--phase-color) 45%, transparent);
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  .orbit { position: absolute; inset: 0; opacity: 0; }
  .orbit span {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: var(--phase-color);
  }
  .orbit span:nth-child(1) { top: -2px; left: 50%; transform: translateX(-50%); }
  .orbit span:nth-child(2) { top: 50%; right: -2px; transform: translateY(-50%); }
  .orbit span:nth-child(3) { bottom: -2px; left: 50%; transform: translateX(-50%); opacity: 0.5; }

  @keyframes breathe   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes ripple    { 0% { transform: scale(0.85); opacity: 0.55; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes pulsefast { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes ripplefast{ 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.35); opacity: 0; } }
  @keyframes pop       { 0% { transform: scale(0.8); } 55% { transform: scale(1.22); } 100% { transform: scale(1); } }
  @keyframes shake     { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes barbounce { 0%,100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

  .orb-stage[data-phase="listening"] .orb-core { animation: breathe 3.4s ease-in-out infinite; }
  .orb-stage[data-phase="listening"] .orb-ring { animation: ripple 3.4s ease-out infinite; }

  .orb-stage[data-phase="awoken"] .orb-core { animation: pop 0.5s ease-out; }
  .orb-stage[data-phase="awoken"] .orb-ring { animation: ripple 0.7s ease-out; }

  .orb-stage[data-phase="recording"] .orb-core { animation: pulsefast 0.85s ease-in-out infinite; }
  .orb-stage[data-phase="recording"] .orb-ring,
  .orb-stage[data-phase="recording"] .orb-ring-2 { animation: ripplefast 0.85s ease-out infinite; }
  .orb-stage[data-phase="recording"] .orb-ring-2 { animation-delay: 0.35s; }

  .orb-stage[data-phase="transcribing"] .orbit,
  .orb-stage[data-phase="sending"] .orbit { opacity: 1; animation: spin 1.1s linear infinite; }
  .orb-stage[data-phase="transcribing"] .orb-core,
  .orb-stage[data-phase="sending"] .orb-core { animation: breathe 1.6s ease-in-out infinite; }

  .orb-stage[data-phase="replied"] .orb-core { animation: pop 0.5s ease-out; }
  .orb-stage[data-phase="replied"] .orb-ring { animation: ripple 0.9s ease-out; }

  .orb-stage[data-phase="rejected"] .orb-core,
  .orb-stage[data-phase="error"] .orb-core { animation: shake 0.4s ease-in-out; }

  .orb-stage[data-phase="offline"] .orb-core { opacity: 0.4; box-shadow: none; }

  .waveform {
    display: flex; gap: 5px; align-items: flex-end; height: 26px;
    margin-top: 1.4em; opacity: 0; transition: opacity 0.25s ease;
  }
  .waveform.show { opacity: 1; }
  .waveform span {
    width: 5px; border-radius: 3px; background: var(--phase-color);
    height: 100%; animation: barbounce 0.7s ease-in-out infinite;
  }
  .waveform span:nth-child(1) { animation-delay: 0s; }
  .waveform span:nth-child(2) { animation-delay: 0.12s; }
  .waveform span:nth-child(3) { animation-delay: 0.24s; }
  .waveform span:nth-child(4) { animation-delay: 0.12s; }
  .waveform span:nth-child(5) { animation-delay: 0s; }

  .phase-label {
    margin-top: 1.5em; font-size: 1.3em; font-weight: 700; letter-spacing: -0.01em;
    color: var(--phase-color-text, var(--text-primary));
  }
  .phase-since { color: var(--text-muted); font-size: 0.8em; margin-top: 0.3em; font-variant-numeric: tabular-nums; }
  .phase-detail {
    margin-top: 1.1em; color: var(--text-secondary); font-size: 0.92em; text-align: center;
    max-width: 26em; line-height: 1.5; min-height: 1.4em;
  }
</style>
</head>
<body>
<div class="viz-root wrap">
  <div class="header">
    <h1>Voice status</h1>
    <span class="live" id="live"><span class="pulse"></span><span id="live-label">live</span></span>
  </div>
  <p class="subtitle">what the wake-word listener is doing right now</p>
  <button id="audio-enable" hidden>🔈 Tap to enable spoken replies</button>

  <div class="ptt-row">
    <button id="ptt-button" type="button" aria-label="Hold to talk">🎤</button>
    <span id="ptt-label">Hold to talk from this device</span>
  </div>
  <div class="mic-note" id="mic-note" hidden></div>

  <div class="panel">
    <div class="orb-wrap">
      <div class="orb-stage" id="orb-stage" data-phase="offline">
        <div class="orb-ring"></div>
        <div class="orb-ring-2"></div>
        <div class="orbit"><span></span><span></span><span></span></div>
        <div class="orb-core"></div>
      </div>
      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="phase-label" id="phase-label">–</div>
      <div class="phase-since" id="phase-since"></div>
      <div class="phase-detail" id="phase-detail"></div>
    </div>
  </div>
</div>
<audio id="player" hidden></audio>

<script>
const PHASES = {
  listening:    { label: 'Listening',          color: '--series-1', detail: () => 'Waiting for the wake word.' },
  awoken:       { label: 'Wake word heard',     color: '--good',     detail: d => 'Score ' + (d.score != null ? d.score.toFixed(2) : '?') },
  recording:    { label: 'Recording',           color: '--danger',   detail: () => 'Capturing your command…', waveform: true },
  transcribing: { label: 'Transcribing',        color: '--series-2', detail: () => 'Sending audio to Groq Whisper…' },
  sending:      { label: 'Thinking',            color: '--series-2', detail: d => d.transcript ? '“' + d.transcript + '”' : '' },
  replied:      { label: 'Replied',             color: '--good',     detail: d => d.reply ? '“' + d.reply + '”' : '' },
  rejected:     { label: 'Ignored',             color: '--warn',
                  detail: d => d.reason === 'speaker mismatch'
                    ? 'Heard someone, but the voice didn’t match — speaker score ' + (d.score != null ? d.score.toFixed(2) : '?')
                    : (d.reason || 'Dropped.') },
  error:        { label: 'Error',               color: '--danger',   detail: d => d.reason || 'Something went wrong.' },
  offline:      { label: 'Offline',             color: '--text-muted', detail: () => 'The listener hasn’t checked in recently.' },
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}
function fmtElapsed(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + 'm ' + r + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

let current = null; // last-rendered snapshot, so the per-second clock tick doesn't need another fetch
let micStream = null, micAudioCtx = null, micWs = null, pttHeld = false; // push-to-talk state — declared here (not lower, next to the functions that use it) because poll() below reads pttHeld before that section of the script would otherwise have run
let lastAudioId = null; // null until the first poll — see applyPhase: whatever's already there when the page opens is not "new"
let audioUnlocked = false; // true once any play() has actually succeeded on this page load

function playPendingAudio() {
  const player = document.getElementById('player');
  player.src = 'api/audio?v=' + current.audio_id; // cache-bust: same path, new clip
  const p = player.play();
  if (p && p.catch) {
    p.then(() => {
      lastAudioId = current.audio_id;
      audioUnlocked = true;
      document.getElementById('audio-enable').hidden = true;
    }).catch(() => {
      // Autoplay blocked until the page has seen a user gesture — leave
      // lastAudioId alone so the retry button plays this same clip.
      document.getElementById('audio-enable').hidden = false;
    });
  } else {
    lastAudioId = current.audio_id;
  }
}
document.getElementById('audio-enable').addEventListener('click', () => {
  if (current) playPendingAudio();
});
// Any interaction with the page at all counts as the unlock gesture, not
// just the dedicated button — browsers only need one real user gesture per
// page load before programmatic play() stops being blocked, so the first
// click/tap/key anywhere quietly satisfies that instead of making you find
// and hit a specific button.
document.addEventListener('pointerdown', () => {
  if (!audioUnlocked && current && current.audio_id && current.audio_id !== lastAudioId) playPendingAudio();
}, { once: true });
document.addEventListener('keydown', () => {
  if (!audioUnlocked && current && current.audio_id && current.audio_id !== lastAudioId) playPendingAudio();
}, { once: true });

function applyPhase(data) {
  const isNewAudio = lastAudioId !== null && data.audio_id && data.audio_id !== lastAudioId;
  if (lastAudioId === null) lastAudioId = data.audio_id; // baseline on first poll — don't replay old replies on load
  current = data;
  if (isNewAudio) playPendingAudio();
  const spec = PHASES[data.phase] || PHASES.offline;
  const stage = document.getElementById('orb-stage');
  const style = getComputedStyle(document.querySelector('.viz-root'));
  const color = spec.color.startsWith('--') ? style.getPropertyValue(spec.color).trim() : spec.color;

  stage.dataset.phase = data.phase;
  stage.style.setProperty('--phase-color', color);
  document.getElementById('phase-label').textContent = spec.label;
  document.getElementById('phase-label').style.color = color;
  let detailText = spec.detail(data.detail || {});
  const src = (data.detail || {}).source;
  // pi_mic never needs calling out — it's the default/only source most of
  // the time. A browser source is the interesting case ("closest mic wins"
  // made visible) — but with multiple devices possibly connected, it may
  // not be *this* viewer's device, so this doesn't claim "this device".
  if (src && src.startsWith('browser_ptt:') && !['listening', 'offline'].includes(data.phase)) {
    detailText += (detailText ? ' ' : '') + '— sent via a browser mic';
  }
  document.getElementById('phase-detail').innerHTML = escapeHtml(detailText);
  document.getElementById('waveform').classList.toggle('show', !!spec.waveform);

  const live = document.getElementById('live');
  live.classList.toggle('offline', !data.online);
  document.getElementById('live-label').textContent = data.online ? 'live' : 'listener offline';
}

function tickClock() {
  if (!current || !current.phase_since) return;
  document.getElementById('phase-since').textContent = fmtElapsed(Date.now() / 1000 - current.phase_since);
}

async function poll() {
  if (pttHeld) return; // don't let a stale server phase stomp the local "recording" state — see startTalking()
  try {
    const resp = await fetch('api/status');
    applyPhase(await resp.json());
  } catch (e) { /* transient — next poll retries */ }
}
poll();
setInterval(poll, 1500);
setInterval(tickClock, 1000);

// --- Push-to-talk: hold the button, stream raw 16kHz mono PCM to
// voice/browser_mic.py over a WebSocket that's open exactly as long as the
// button is held; releasing it closes the connection, which *is* the "end
// of recording" signal server-side. No wake word involved on this path —
// pressing the button already means "I'm about to say a command," the same
// intent a wake word exists to substitute for (see browser_mic.py's
// docstring for why continuous always-listening browser mics were tried
// and dropped in favor of this). Requires a secure context (HTTPS, or
// localhost) — every browser refuses getUserMedia() otherwise. (State vars
// are declared up near `current`, not here — see that comment.)

function micNote(text, isError) {
  const el = document.getElementById('mic-note');
  el.textContent = text;
  el.classList.toggle('error', !!isError);
  el.hidden = !text;
}

async function startTalking() {
  if (pttHeld) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    micNote('This page needs HTTPS (or localhost) for microphone access — plain http:// isn’t allowed by the browser.', true);
    return;
  }
  pttHeld = true;
  const button = document.getElementById('ptt-button');
  button.classList.add('held');
  // Immediate local feedback — the server only learns a recording happened
  // once this connection closes, so waiting on the next poll tick would
  // show nothing until well after you've already released the button.
  applyPhase({ phase: 'recording', detail: {}, online: true, phase_since: Date.now() / 1000, audio_id: lastAudioId });

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    micNote('Microphone access denied or unavailable (' + e.message + ').', true);
    stopTalking();
    return;
  }
  if (!pttHeld) { micStream.getTracks().forEach(t => t.stop()); return; } // released while permission prompt was up

  const wsUrl = new URL('mic-ws', document.baseURI);
  wsUrl.protocol = wsUrl.protocol === 'https:' ? 'wss:' : 'ws:';
  micWs = new WebSocket(wsUrl);
  micWs.binaryType = 'arraybuffer';

  // AudioContext({sampleRate: 16000}) does the resample from whatever the
  // hardware actually captures at — openWakeWord/Whisper both need 16kHz,
  // same as the Pi's own capture path (see audio.py).
  micAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const source = micAudioCtx.createMediaStreamSource(micStream);
  // ScriptProcessorNode is deprecated in favor of AudioWorklet, but is far
  // simpler for a single-file page (no separate worklet module to load)
  // and is still supported everywhere it's deprecated, which is what a
  // small, infrequently-touched capture path like this one should
  // optimize for over using the newer API.
  const processor = micAudioCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!micWs || micWs.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    micWs.send(pcm16.buffer);
  };
  // ScriptProcessorNode only fires reliably once connected through to a
  // destination — routed through a muted gain node so the mic is never
  // actually played back out the speakers (which would just be feedback).
  const muteGain = micAudioCtx.createGain();
  muteGain.gain.value = 0;
  source.connect(processor);
  processor.connect(muteGain);
  muteGain.connect(micAudioCtx.destination);

  micWs.addEventListener('error', () => micNote('Could not reach the voice listener for mic streaming.', true));
  micNote('');
}

function stopTalking() {
  if (!pttHeld) return;
  pttHeld = false;
  document.getElementById('ptt-button').classList.remove('held');
  const hadRealRecording = !!micWs; // false if released during the getUserMedia permission prompt, or on denial
  if (micWs) { try { micWs.close(); } catch (e) {} micWs = null; }
  if (micAudioCtx) { try { micAudioCtx.close(); } catch (e) {} micAudioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  // Optimistic: we know what's about to happen server-side and don't need
  // to wait up to 1500ms for the next poll to show it — poll() will take
  // back over (and correct this if reality differs) on its own next tick,
  // now that pttHeld is false again.
  if (hadRealRecording) {
    applyPhase({ phase: 'transcribing', detail: {}, online: true, phase_since: Date.now() / 1000, audio_id: lastAudioId });
  }
}

const pttButton = document.getElementById('ptt-button');
pttButton.addEventListener('mousedown', startTalking);
pttButton.addEventListener('mouseup', stopTalking);
pttButton.addEventListener('mouseleave', stopTalking); // dragged off while held — don't leave it stuck open
pttButton.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); }, { passive: false });
pttButton.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); }, { passive: false });
pttButton.addEventListener('touchcancel', (e) => { e.preventDefault(); stopTalking(); }, { passive: false });
</script>
</body>
</html>

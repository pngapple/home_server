# Installed to /etc/sysctl.d/ by scripts/install_services.sh.
#
# Lets this machine act as a Tailscale exit node: a device that turns on
# "Use exit node -> raspberrypi" sends all its traffic here, and it leaves
# through the home connection. Without forwarding, tailscaled advertises the
# node but every packet dies at the kernel.
#
# IPv6 forwarding normally makes the kernel stop accepting router
# advertisements, but NetworkManager does its own RA handling here
# (accept_ra is already 0 on every interface), so this doesn't cost the LAN
# its IPv6 config.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Installed to /etc/systemd/system/pihole-FTL.service.d/override.conf by
# scripts/install_services.sh.
#
# Pi-hole answers DNS only on tailscale0 (scripts/pihole/pihole.toml). Its
# SINGLE listening mode binds the wildcard address and filters by interface,
# so it doesn't strictly need tailscale0 to exist yet - but start after
# tailscaled anyway, so the first queries after boot aren't dropped.
# Deliberately After=/Wants=, not Requires=: restarting tailscaled must not
# take DNS down with it.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

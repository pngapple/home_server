# Installed to /etc/systemd/system/dnsmasq.service.d/override.conf by
# scripts/install_services.sh.
#
# /etc/dnsmasq.d/status.conf binds dnsmasq to the tailscale0 interface (it
# answers DNS only over the tailnet). On a cold boot dnsmasq can start
# before tailscaled has created that interface, and dnsmasq's own unit has
# no Restart= — it fails once ("unknown interface tailscale0") and then
# just sits dead until someone runs `systemctl restart dnsmasq` by hand.
# This is what made DNS "randomly" down after a Pi restart.
[Unit]
After=tailscaled.service
Requires=tailscaled.service

[Service]
Restart=on-failure
RestartSec=5

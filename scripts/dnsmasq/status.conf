# Installed to /etc/dnsmasq.d/status.conf by scripts/install_services.sh,
# which substitutes __TAILSCALE_IP__ for this machine's actual `tailscale ip -4`.
#
# Serves the bare-name shortcuts (http://llm, http://cigboard, ...) to the
# tailnet. Tailscale Serve handles the /llm/ /cigboard/ style paths on the real
# hostname and issues their certs; it cannot do these bare names, because no
# certificate can cover them. These stay plain HTTP on purpose.
#
# Bound ONLY to the Tailscale interface - never expose an open resolver publicly.
interface=tailscale0

# bind-dynamic, NOT bind-interfaces. This is a regression guard, see
# tests/test_dnsmasq_config.py.
#
# tailscaled's unit goes active the instant the daemon starts, which is well
# before it has authenticated to the control plane and put an IPv4 address on
# tailscale0. bind-interfaces snapshots interface addresses once at startup, so
# dnsmasq would come up having bound nothing on the tailnet - and because that
# is not an *error*, it stayed "active (running)" and Restart=on-failure never
# fired. Every device accepting Tailscale DNS then lost not just the shortcuts
# but all ordinary internet lookups, since this resolver forwards those too.
# bind-dynamic follows netlink and picks the address up whenever it appears.
bind-dynamic

# don't read /etc/hosts or /etc/resolv.conf - keep this fully self-contained
no-hosts
no-resolv

# the actual records
address=/status/__TAILSCALE_IP__
address=/llm/__TAILSCALE_IP__
address=/cigboard/__TAILSCALE_IP__
address=/voice/__TAILSCALE_IP__

# forward everything else to public upstream resolvers
server=1.1.1.1
server=8.8.8.8

domain-needed
bogus-priv
